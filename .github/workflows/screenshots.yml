name: Screenshots

# Manual only. Renders the real screens with Paparazzi (no emulator) and commits PNGs to docs/screenshots.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 3. Install Android platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: 4. Record screenshots
        run: |
          chmod +x gradlew
          ./gradlew recordPaparazziDebug --no-daemon --stacktrace

      - name: 5. Copy screenshots into docs
        run: |
          mkdir -p docs/screenshots
          for f in app/src/test/snapshots/images/*.png; do
            name=$(basename "$f" | sed 's/^com\.filtertap\.app_ScreenshotTest_//')
            cp "$f" "docs/screenshots/$name"
          done
          ls -l docs/screenshots

      - name: 6. Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes."
          else
            git commit -m "docs: update screenshots"
            git push
          fi
