name: Build and Release Android APK

# Manual only: pushes, pull requests and tags do NOT start this workflow.
# Run it from the Actions tab -> "Build and Release Android APK" -> "Run workflow",
# or via the GitHub API / gh CLI (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type to produce'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      createRelease:
        description: 'Also create a GitHub Release with the APK attached'
        required: true
        default: false
        type: boolean
      releaseTag:
        description: 'Tag for the GitHub Release (e.g. v1.0.0). Used only when createRelease is true.'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.buildType }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.buildType }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Optional repo secrets. The fallbacks keep the workflow runnable without them,
      # but set real secrets for a production key (see notes in the README).
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'filtertap-release-key-pass-2026' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'filtertap-release-key-pass-2026' }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application Assets
        run: npm run build

      - name: 5. Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 6. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 7. Accept Android SDK Licenses and Install Platform
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "SDK ready at $ANDROID_HOME"

      - name: 8. Restore Release Keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Preferred: a persistent keystore stored as a repo secret, so every
            # release is signed with the same certificate (required for updates).
            echo "$KEYSTORE_BASE64" | base64 -d > app/filtertap-release.keystore
            echo "Using release keystore from KEYSTORE_BASE64 secret."
          elif [ ! -f "app/filtertap-release.keystore" ]; then
            echo "WARNING: no KEYSTORE_BASE64 secret and no keystore in repo; generating a temporary one."
            echo "Releases signed with this key cannot update installs signed with any other key."
            keytool -genkeypair -v \
              -keystore app/filtertap-release.keystore \
              -alias filtertap-release-key \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=FilterTap, OU=Mobile, O=FilterTap, C=US"
          fi

      - name: 9. Grant Execute Permission for Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: 10. Build Android APK
        working-directory: android
        env:
          BUILD_TYPE: ${{ inputs.buildType }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: 11. Collect APK
        id: apk
        run: |
          if [ "${{ inputs.buildType }}" = "release" ]; then
            SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
            OUT="FilterTap-${{ inputs.releaseTag }}-release.apk"
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            OUT="FilterTap-${{ inputs.releaseTag }}-debug.apk"
          fi
          cp "$SRC" "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: 12. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilterTap-${{ inputs.buildType }}-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: 13. Create GitHub Release
        if: inputs.createRelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.releaseTag }}
          name: FilterTap ${{ inputs.releaseTag }}
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ inputs.buildType == 'debug' }}
          generate_release_notes: true
