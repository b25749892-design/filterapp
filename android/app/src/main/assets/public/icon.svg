<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e17" />
      <stop offset="100%" stop-color="#131c2e" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1f2d47" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="276" r="140" fill="url(#glowGrad)" filter="blur(20px)" />

  <!-- Water Drop Outline & Core -->
  <g filter="url(#shadow)">
    <!-- Water drop path centered -->
    <path d="M 256 96 C 256 96 368 236 368 320 C 368 381.85 317.85 432 256 432 C 194.15 432 144 381.85 144 320 C 144 236 256 96 256 96 Z" fill="url(#dropGrad)" />

    <!-- Droplet Highlights -->
    <path d="M 216 230 C 240 180 256 140 256 140 C 256 140 230 190 200 250 C 182 286 178 320 182 344 C 174 324 172 296 216 230 Z" fill="#ffffff" opacity="0.45" />

    <!-- Filter Wave / Level Bars Inside Drop -->
    <path d="M 180 320 Q 218 300 256 320 T 332 320" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M 200 355 Q 228 340 256 355 T 312 355" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 224 388 Q 240 378 256 388 T 288 388" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>

  <!-- Small accent droplet -->
  <circle cx="340" cy="180" r="12" fill="#38bdf8" opacity="0.9" />
</svg>
